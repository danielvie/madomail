version: '3'

tasks:
  default:
    cmds:
      - task --list

  run:
    aliases: [r]
    desc: Run the Tauri app in development
    cmds:
      - task: tauri:dev

  web:install:
    aliases: [i]
    desc: Install frontend dependencies
    cmds:
      - npm install

  dev:
    desc: Run the frontend dev server
    cmds:
      - npm run dev

  tauri:dev:
    desc: Run the Tauri app with the frontend dev server
    cmds:
      - npm run tauri:dev

  tauri:build:
    desc: Build complete standalone Tauri app
    cmds:
      - npm run tauri:build

  web:build:
    desc: Build the frontend bundle
    cmds:
      - npm run build

  clean:
    desc: Clean frontend and Tauri build artifacts
    cmds:
      - sh -c 'rm -rf dist src-tauri/target'
