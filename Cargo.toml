[package]
name = "mado-mail"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
embed-resource = "=3.0.11"

[dependencies]
anyhow = "1"
ammonia = "=4.2.0"
base64 = "0.22"
encoding_rs = "0.8"
futures = "0.3"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
keyring = "=4.2.0"
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
